services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-couponGenerator}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://${SERVER_HOST:-192.168.0.242}:8189
      KC_PROXY_HEADERS: xforwarded
    volumes:
      # start-dev keeps its database under /opt/keycloak/data; the volume keeps clients, users and
      # secrets created in the admin console across container recreates. Once the realm exists,
      # --import-realm skips it, so later realm-export.json edits must be made in the console too.
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-tadiewa/cms-be:latest}
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      # Everything non-secret about this environment lives in application-test.yaml; only the
      # host and secrets from .env are passed through here.
      SPRING_PROFILES_ACTIVE: test
      SERVER_HOST: ${SERVER_HOST:?set SERVER_HOST in .env}
      DB_NAME: ${DB_NAME:-couponGenerator}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-petrotrade}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-coupon-admin-api}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-local-dev-admin-api-secret}
      QR_SECRET_KEY: ${QR_SECRET_KEY:-change-me-in-production-qr-secret}
      ERP_ENABLED: ${ERP_ENABLED:-true}
      ERP_MOCK: ${ERP_MOCK:-true}
      ERP_SALES_ENABLED: ${ERP_SALES_ENABLED:-false}
      ERP_SALES_MOCK: ${ERP_SALES_MOCK:-true}
    restart: unless-stopped

  fe:
    image: ${FE_IMAGE:-tadiewa/cms-fe:latest}
    build:
      context: ../../frontendcoupon
      args:
        VITE_API_BASE_URL: https://${SERVER_HOST:-192.168.0.242}:8580/api/v1
        VITE_KEYCLOAK_URL: https://${SERVER_HOST:-192.168.0.242}:8189
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-petrotrade}
        VITE_KEYCLOAK_CLIENT_ID: coupon-backend
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - fe
      - backend
      - keycloak
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
      - "8580:8580"
      - "8189:8189"
    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-data:
