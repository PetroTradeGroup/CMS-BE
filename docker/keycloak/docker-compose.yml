services:
  keycloak:
    # AD-6/Stack: no LTS track for Keycloak — 26.7 is current as of this file's authoring; bump
    # freely, don't chase an exact patch.
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pins the token "iss" claim to one fixed value regardless of which address a client used to
      # reach Keycloak (localhost for the web app, the LAN IP for a phone that can't resolve
      # localhost) — without this, each connection path mints tokens with a different issuer and
      # the backend (which checks against one exact issuer string) only ever accepts one of them.
      # This is your machine's current Wi-Fi IP — update it if that IP changes (DHCP renewal, a
      # different network) and re-apply this + application.yaml's issuer-uri/jwk-set-uri defaults.
      KC_HOSTNAME: "10.10.2.248"
    ports:
      - "8189:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

# Local dev only (per the spine's Deferred section — staging/production topology is undecided).
# Admin console still reachable at http://localhost:8189 (admin/admin) — KC_HOSTNAME only pins the
# *issued* URLs (iss claim, endpoints returned by discovery), not which addresses can connect.
# Backend's default KEYCLOAK_ISSUER_URI (application.yaml) must match KC_HOSTNAME above exactly:
# currently http://10.10.2.248:8189/realms/petrotrade.
#
# Notes on realm-export.json (Keycloak's importer rejects unrecognized JSON fields, so these
# can't live as "_comment" keys inside the file itself):
# - AD-2: roles are 1:1 from docs/rbac-decision-memo.html's table. PROCUREMENT_*/FINANCE_* are
#   deliberately not created yet — reserved but gate nothing (no endpoints for those departments).
# - AD-8: the department-claim client scope reads a per-user "department" attribute, not group
#   path, so the JWT claim is always a plain string, never an array. Group membership is only
#   what grants a department's realm roles.
# - The "admin.user" seed has department=STOCKS (not blank) so it can also exercise
#   ApprovalController.approve/confirm-receipt locally — DepartmentAccessGuard runs for every
#   department-handoff request regardless of role, ADMIN included.
# - All seed users share password "dev" — never reuse these credentials outside local dev.
