worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 15M;

    # Plain-HTTP visits to the bare IP land here first (browsers default to :80)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Frontend SPA
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        location / {
            proxy_pass http://fe:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Backend API
    server {
        listen 8580 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # A plain-http hit on this TLS-only port (stray bookmark, autocomplete, etc.) redirects
        # to https instead of showing nginx's raw "HTTP request sent to HTTPS port" error.
        error_page 497 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://backend:8580;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Keycloak — proxy headers let Keycloak know the original request was HTTPS, which is what
    # satisfies its sslRequired check (both for the app's realm and, now, the admin console).
    server {
        listen 8189 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Same plain-http-on-TLS-port safety net as the backend server block above.
        error_page 497 https://$host:$server_port$request_uri;

        location / {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 8189;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
