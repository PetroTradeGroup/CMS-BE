spring:
  application:
    name: couponnumbergenerator
  datasource:
    url: jdbc:postgresql://localhost:5432/couponGenerator
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

app:
  ai:
    ollama:
      base-url: http://localhost:11434
      model: llama3.1:8b
      timeout-seconds: 180
  qr:
    secret-key: ${QR_SECRET_KEY:change-me-in-production-qr-secret}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
