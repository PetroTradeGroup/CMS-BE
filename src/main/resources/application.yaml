# Shared settings. Anything that differs between environments lives in a profile:
#   application-local.yaml — your machine (the default: IDE / mvnw spring-boot:run, no setup)
#   application-test.yaml  — the test server (docker-compose.yml sets SPRING_PROFILES_ACTIVE=test)
# Secrets never go in these files for the test server — they come from its .env via compose.
spring:
  application:
    name: couponnumbergenerator
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8580

app:
  keycloak:
    realm: ${KEYCLOAK_REALM:petrotrade}
    admin:
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:coupon-admin-api}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  ai:
    ollama:
      base-url: http://localhost:11434
      model: llama3.1:8b
      timeout-seconds: 180
  qr:
    secret-key: ${QR_SECRET_KEY}
  erp:
    enabled: ${ERP_ENABLED:true}
    mock: ${ERP_MOCK:true}
    base-url: ${ERP_BASE_URL:http://localhost:9090}
    redemption-endpoint: ${ERP_REDEMPTION_ENDPOINT:/api/redemptions}
    api-key: ${ERP_API_KEY:local-dev-erp-sales-key}
    timeout-seconds: 30
    retry-interval-ms: 300000
    sales:
      enabled: ${ERP_SALES_ENABLED:false}
      mock: ${ERP_SALES_MOCK:true}
      base-url: ${ERP_SALES_BASE_URL:http://localhost:9091}
      confirmation-endpoint: ${ERP_SALES_CONFIRMATION_ENDPOINT:/api/coupon-sales/confirm}
      timeout-seconds: 30
      retry-interval-ms: 300000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: coupon-backend
      use-pkce-with-authorization-code-grant: true
